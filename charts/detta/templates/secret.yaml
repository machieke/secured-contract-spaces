{{- if and .Values.consensus.enabled (not .Values.consensus.seed.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "detta.consensusSecretName" . }}
  labels:
    {{- include "detta.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.consensus.seed.key }}: {{ required "consensus.seed.value is required when consensus.seed.existingSecret is empty" .Values.consensus.seed.value | quote }}
{{- end }}
