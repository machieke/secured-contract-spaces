{{- if .Values.rpcNode.enabled -}}
{{- $rpcEnvPrefix := include "detta.rpcName" . | upper | replace "-" "_" -}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "detta.fullname" . }}-rpc-state-root-test
  labels:
    {{- include "detta.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: state-root
      image: {{ include "detta.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command:
        - /bin/sh
        - -ec
      args:
        - |
          rpc_host="$(printenv "{{ $rpcEnvPrefix }}_SERVICE_HOST" || true)"
          rpc_port="$(printenv "{{ $rpcEnvPrefix }}_SERVICE_PORT" || true)"
          if [ -n "$rpc_host" ]; then
            rpc_target="${rpc_host}:${rpc_port:-{{ .Values.rpc.port }}}"
          else
            rpc_target="{{ include "detta.rpcName" . }}:{{ .Values.rpc.port }}"
          fi
          for attempt in $(seq 1 30); do
            /usr/local/bin/detta-client state-root --rpc "$rpc_target" && exit 0
            sleep 2
          done
          exit 1
      securityContext:
        {{- toYaml .Values.containerSecurityContext | nindent 8 }}
{{- end }}
