# DeTTa BFT network (rotating proposer + view-change).
#
# Four validators run Byzantine-fault-tolerant consensus in a full mesh. The
# proposer rotates every height (roster[(height-1+view) % N]); each validator
# verifies and votes without committing, and commits only on a verified quorum
# finality certificate. If a proposer stalls, a view-change timeout promotes the
# next validator. A non-validating RPC node and restarted validators catch up via
# certificate-verified backfill. All nodes share one genesis from genesis-init.
#
#   docker compose -f docker/docker-compose.yml up --build -d
#   docker compose -f docker/docker-compose.yml logs -f validator-2   # finalized / view-change lines
#   docker compose -f docker/docker-compose.yml stop validator-1      # watch view-change keep the chain live
#
# Validator keys are derived deterministically from the shared DETTA_CONSENSUS_SEED
# and the roster, so no key files are distributed. See docker/README.md for the
# consensus model and its bounds (residual: no NEW-VIEW locked-value re-proposal).

name: detta-network

x-detta-node: &detta-node
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: detta-node:local
  restart: unless-stopped
  depends_on:
    genesis-init:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "detta-client", "state-root", "--rpc", "127.0.0.1:8080"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 10s

# Shared BFT settings merged into every validator's environment.
x-bft-env: &bft-env
  DETTA_BFT: "1"
  DETTA_VALIDATORS: validator-1,validator-2,validator-3,validator-4
  DETTA_NETWORK_ID: detta-testnet
  # Demo secret — every node derives the whole validator set from this. Replace
  # for any non-throwaway use.
  DETTA_CONSENSUS_SEED: detta-demo-consensus-seed-change-me

services:
  # One-shot: writes the shared genesis snapshot if it does not already exist.
  genesis-init:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: detta-node:local
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        [ -f /genesis/genesis.json ] ||
        detta-node write-genesis
        --output /genesis/genesis.json
        --chain-id detta-local
        --preset defi-demo
    volumes:
      - genesis:/genesis

  # Validators run a rotating-proposer BFT: each height's proposer is
  # roster[(height-1+view) % N]; a view-change timeout promotes the next
  # validator if the current proposer stalls. Every validator listens, votes,
  # and can propose. Commit happens only on a verified quorum certificate.
  validator-1:
    <<: *detta-node
    container_name: detta-validator-1
    environment:
      <<: *bft-env
      DETTA_VALIDATOR_ID: validator-1
      DETTA_CONSENSUS_LISTEN: 0.0.0.0:9080
      DETTA_CONSENSUS_PEERS: validator-2=validator-2:9080,validator-3=validator-3:9080,validator-4=validator-4:9080
      DETTA_RPC_PEERS: validator-2:8080,validator-3:8080,validator-4:8080
      DETTA_PRODUCE_INTERVAL_SECS: "5"
    volumes:
      - genesis:/genesis:ro
      - validator-1-data:/data
    ports:
      - "8081:8080"

  validator-2:
    <<: *detta-node
    container_name: detta-validator-2
    environment:
      <<: *bft-env
      DETTA_VALIDATOR_ID: validator-2
      DETTA_CONSENSUS_LISTEN: 0.0.0.0:9080
      DETTA_CONSENSUS_PEERS: validator-1=validator-1:9080,validator-3=validator-3:9080,validator-4=validator-4:9080
      DETTA_RPC_PEERS: validator-1:8080,validator-3:8080,validator-4:8080
      DETTA_PRODUCE_INTERVAL_SECS: "5"
    volumes:
      - genesis:/genesis:ro
      - validator-2-data:/data
    ports:
      - "8082:8080"

  validator-3:
    <<: *detta-node
    container_name: detta-validator-3
    environment:
      <<: *bft-env
      DETTA_VALIDATOR_ID: validator-3
      DETTA_CONSENSUS_LISTEN: 0.0.0.0:9080
      DETTA_CONSENSUS_PEERS: validator-1=validator-1:9080,validator-2=validator-2:9080,validator-4=validator-4:9080
      DETTA_RPC_PEERS: validator-1:8080,validator-2:8080,validator-4:8080
      DETTA_PRODUCE_INTERVAL_SECS: "5"
    volumes:
      - genesis:/genesis:ro
      - validator-3-data:/data
    ports:
      - "8083:8080"

  validator-4:
    <<: *detta-node
    container_name: detta-validator-4
    environment:
      <<: *bft-env
      DETTA_VALIDATOR_ID: validator-4
      DETTA_CONSENSUS_LISTEN: 0.0.0.0:9080
      DETTA_CONSENSUS_PEERS: validator-1=validator-1:9080,validator-2=validator-2:9080,validator-3=validator-3:9080
      DETTA_RPC_PEERS: validator-1:8080,validator-2:8080,validator-3:8080
      DETTA_PRODUCE_INTERVAL_SECS: "5"
    volumes:
      - genesis:/genesis:ro
      - validator-4-data:/data
    ports:
      - "8084:8080"

  # Non-validating full node for clients. Not in the validator set; catches up
  # cert-verified finalized blocks from any validator (robust to proposer
  # rotation).
  rpc:
    <<: *detta-node
    container_name: detta-rpc
    environment:
      <<: *bft-env
      DETTA_VALIDATOR_ID: rpc-1
      DETTA_RPC_PEERS: validator-1:8080,validator-2:8080,validator-3:8080,validator-4:8080
    volumes:
      - genesis:/genesis:ro
      - rpc-data:/data
    ports:
      - "8080:8080"

  # Client driver. Not started by default; use `docker compose run`:
  #   docker compose -f docker/docker-compose.yml run --rm client <subcommand> --rpc <service>:8080
  client:
    image: detta-node:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
    profiles: ["tools"]
    depends_on:
      genesis-init:
        condition: service_completed_successfully
    entrypoint: ["detta-client"]
    command: ["state-root", "--rpc", "rpc:8080"]

volumes:
  genesis:
  validator-1-data:
  validator-2-data:
  validator-3-data:
  validator-4-data:
  rpc-data:
