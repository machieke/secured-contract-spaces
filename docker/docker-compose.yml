# DeTTa BFT network.
#
# Four validators run Byzantine-fault-tolerant consensus: validator-1 proposes
# signed blocks each round; validator-2..4 verify-import them and return signed
# votes; the proposer aggregates a quorum into a finality certificate and
# broadcasts it. A non-validating RPC node follows the chain for clients. All
# nodes share one genesis written once by genesis-init.
#
#   docker compose -f docker/docker-compose.yml up --build -d
#   docker compose -f docker/docker-compose.yml ps
#   docker compose -f docker/docker-compose.yml logs -f validator-1   # finalized height=N signers=[...]
#
# Validator keys are derived deterministically from the shared DETTA_CONSENSUS_SEED
# and the roster, so no key files are distributed. See docker/README.md for the
# consensus model and its bounds (single proposer; no leader rotation).

name: detta-network

x-detta-node: &detta-node
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: detta-node:local
  restart: unless-stopped
  depends_on:
    genesis-init:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "detta-client", "state-root", "--rpc", "127.0.0.1:8080"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 10s

# Shared BFT settings merged into every validator's environment.
x-bft-env: &bft-env
  DETTA_BFT: "1"
  DETTA_VALIDATORS: validator-1,validator-2,validator-3,validator-4
  DETTA_PROPOSER: validator-1
  DETTA_NETWORK_ID: detta-testnet
  # Demo secret — every node derives the whole validator set from this. Replace
  # for any non-throwaway use.
  DETTA_CONSENSUS_SEED: detta-demo-consensus-seed-change-me

services:
  # One-shot: writes the shared genesis snapshot if it does not already exist.
  genesis-init:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: detta-node:local
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        [ -f /genesis/genesis.json ] ||
        detta-node write-genesis
        --output /genesis/genesis.json
        --chain-id detta-local
        --preset defi-demo
    volumes:
      - genesis:/genesis

  # Proposer: produces and signs a block each round, gathers votes, and forms +
  # broadcasts the quorum finality certificate.
  validator-1:
    <<: *detta-node
    container_name: detta-validator-1
    environment:
      <<: *bft-env
      DETTA_VALIDATOR_ID: validator-1
      DETTA_CONSENSUS_PEERS: validator-2:9080,validator-3:9080,validator-4:9080
      DETTA_PRODUCE_INTERVAL_SECS: "5"
    volumes:
      - genesis:/genesis:ro
      - validator-1-data:/data
    ports:
      - "8081:8080"

  # Voting validators: listen for the proposer's signed block, verify-import it,
  # and reply with a signed vote.
  validator-2:
    <<: *detta-node
    container_name: detta-validator-2
    environment:
      <<: *bft-env
      DETTA_VALIDATOR_ID: validator-2
      DETTA_CONSENSUS_LISTEN: 0.0.0.0:9080
      DETTA_BACKFILL_PEER: validator-1:8080
    volumes:
      - genesis:/genesis:ro
      - validator-2-data:/data
    ports:
      - "8082:8080"

  validator-3:
    <<: *detta-node
    container_name: detta-validator-3
    environment:
      <<: *bft-env
      DETTA_VALIDATOR_ID: validator-3
      DETTA_CONSENSUS_LISTEN: 0.0.0.0:9080
      DETTA_BACKFILL_PEER: validator-1:8080
    volumes:
      - genesis:/genesis:ro
      - validator-3-data:/data
    ports:
      - "8083:8080"

  validator-4:
    <<: *detta-node
    container_name: detta-validator-4
    environment:
      <<: *bft-env
      DETTA_VALIDATOR_ID: validator-4
      DETTA_CONSENSUS_LISTEN: 0.0.0.0:9080
      DETTA_BACKFILL_PEER: validator-1:8080
    volumes:
      - genesis:/genesis:ro
      - validator-4-data:/data
    ports:
      - "8084:8080"

  # Non-validating full node for public RPC / client access. Not part of the
  # validator set; follows the chain via RPC block sync for client queries.
  rpc:
    <<: *detta-node
    container_name: detta-rpc
    environment:
      DETTA_VALIDATOR_ID: rpc-1
      DETTA_SYNC_PEER: validator-1:8080
      DETTA_SYNC_INTERVAL_SECS: "2"
    volumes:
      - genesis:/genesis:ro
      - rpc-data:/data
    ports:
      - "8080:8080"

  # Client driver. Not started by default; use `docker compose run`:
  #   docker compose -f docker/docker-compose.yml run --rm client <subcommand> --rpc <service>:8080
  client:
    image: detta-node:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
    profiles: ["tools"]
    depends_on:
      genesis-init:
        condition: service_completed_successfully
    entrypoint: ["detta-client"]
    command: ["state-root", "--rpc", "rpc:8080"]

volumes:
  genesis:
  validator-1-data:
  validator-2-data:
  validator-3-data:
  validator-4-data:
  rpc-data:
