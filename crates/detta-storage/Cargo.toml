[package]
name = "detta-storage"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = []
experimental-da = [
    "detta-consensus/experimental-da",
    "detta-core/experimental-da",
    "detta-da/experimental-da",
    "detta-protocol/experimental-da",
]

[dependencies]
detta-consensus = { path = "../detta-consensus" }
detta-core = { path = "../detta-core" }
detta-da = { path = "../detta-da" }
detta-protocol = { path = "../detta-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
