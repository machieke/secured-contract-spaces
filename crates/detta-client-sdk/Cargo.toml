[package]
name = "detta-client-sdk"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = []
experimental-da = [
    "detta-da/experimental-da",
    "detta-rpc/experimental-da",
]

[dependencies]
detta-da = { path = "../detta-da" }
detta-rpc = { path = "../detta-rpc" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
