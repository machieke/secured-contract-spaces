[package]
name = "detta-da"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = []
experimental-da = ["detta-core/experimental-da"]

[dependencies]
detta-core = { path = "../detta-core" }
reed-solomon-erasure = { version = "6.0.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
