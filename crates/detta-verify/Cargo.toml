[package]
name = "detta-verify"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = []
experimental-da = ["detta-aspects/experimental-da", "detta-core/experimental-da"]

[dependencies]
detta-aspects = { path = "../detta-aspects" }
detta-da = { path = "../detta-da" }
detta-core = { path = "../detta-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
