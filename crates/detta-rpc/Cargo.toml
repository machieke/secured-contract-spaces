[package]
name = "detta-rpc"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = []
experimental-da = [
    "detta-aspects/experimental-da",
    "detta-consensus/experimental-da",
    "detta-core/experimental-da",
    "detta-da/experimental-da",
    "detta-evaluator/experimental-da",
    "detta-protocol/experimental-da",
    "detta-storage/experimental-da",
]

[dependencies]
detta-aspects = { path = "../detta-aspects" }
detta-consensus = { path = "../detta-consensus" }
detta-core = { path = "../detta-core" }
detta-da = { path = "../detta-da" }
detta-evaluator = { path = "../detta-evaluator" }
detta-protocol = { path = "../detta-protocol" }
detta-storage = { path = "../detta-storage" }
ed25519-dalek = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
